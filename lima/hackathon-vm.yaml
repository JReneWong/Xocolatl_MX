# Lima VM config for the MVA hackathon.
# Docs: https://lima-vm.io/docs/config/
#
# On each laptop: edit the `location` under `mounts` to match where the SSD
# is mounted on THIS machine (check with `ls /Volumes`).

vmType: "vz"          # use Apple's native virtualization on Apple Silicon/macOS 13+
                       # (falls back fine to "qemu" if you hit issues — just change this line)
os: "Linux"
arch: "default"

images:
  - location: "https://cloud-images.ubuntu.com/releases/22.04/release/ubuntu-22.04-server-cloudimg-arm64.img"
    arch: "aarch64"
  - location: "https://cloud-images.ubuntu.com/releases/22.04/release/ubuntu-22.04-server-cloudimg-amd64.img"
    arch: "x86_64"

# --- Resources ---
# Current: tuned for the 8GB laptop (setup/dev only, not full pipeline runs).
# When on the 32GB MacBook Air, raise memory to ~24GiB and cpus to 6-8,
# then `limactl stop hackathon && limactl start hackathon`.
cpus: 2
memory: "4GiB"
disk: "20GiB"          # VM's own root disk (for the OS + apptainer + tool installs,
                        # NOT for the dataset — that stays on the mounted SSD)

mounts:
  - location: "/Volumes/ReneWong"
    mountPoint: "/mnt/ssd"
    writable: true

# Keep the default home-directory mount too, off by default here to avoid
# confusion about where the working repo lives (it should live on /mnt/ssd).
mountType: "virtiofs"

containerd:
  system: false
  user: false
