# Lima VM config for the MVA hackathon.
# Docs: https://lima-vm.io/docs/config/

vmType: "vz"          # use Apple's native virtualization on Apple Silicon/macOS 13+
                       # (falls back fine to "qemu" if you hit issues — just change this line)
os: "Linux"
arch: "default"

images:
  - location: "https://cloud-images.ubuntu.com/releases/22.04/release/ubuntu-22.04-server-cloudimg-arm64.img"
    arch: "aarch64"
  - location: "https://cloud-images.ubuntu.com/releases/22.04/release/ubuntu-22.04-server-cloudimg-amd64.img"
    arch: "x86_64"

# --- Resources ---
# Current: tuned for a 8GB laptop (setup/dev only, not full pipeline runs).
# With larger resources, raise memory to ~24GiB and cpus to 6-8,
# then `limactl stop hackathon && limactl start hackathon`.
cpus: 8
memory: "16GiB"
disk: "20GiB"          # VM's own root disk (for the OS + apptainer + tool installs,
                        # NOT for the dataset — that stays on the mounted SSD)

# Mount home
mounts:
  - location: "~"
    writable: true
# If using an external drive, uncomment the following lines and set the appropriate paths
#   - location: "/Volumes/SSD"
#     mountPoint: "/mnt/ssd"
#     writable: true

mountType: "virtiofs"

containerd:
  system: false
  user: false
